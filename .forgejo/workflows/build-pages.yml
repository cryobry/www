name: Build pages

'on':
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: pages-${{ forgejo.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: pages
    timeout-minutes: 30

    steps:
      - name: Checkout source
        # This downloads the checkout Action implementation from data.forgejo.org;
        # it checks out the triggering repository from this Forgejo instance.
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ forgejo.ref_name }}
          path: source
          persist-credentials: false

      - name: Build sites
        env:
          JEKYLL_ENV: production
        run: |
          set -euo pipefail
          gem install bundler -v 2.5.22 --no-document
          for site in landing.bryanroessler.com blog.bryanroessler.com cv.bryanroessler.com; do
            (
              cd "source/$site"
              bundle _2.5.22_ config set --local path vendor/bundle
              bundle _2.5.22_ install --jobs 4
              bundle _2.5.22_ exec jekyll build --destination _site
              test -f _site/index.html
            )
          done

      - name: Publish sites
        run: |
          set -euo pipefail
          case "${{ forgejo.ref_name }}" in
            main) target=/srv/www/main ;;
            dev) target=/srv/www/dev ;;
            *) printf '%s\n' "Unsupported deployment ref: ${{ forgejo.ref_name }}" >&2; exit 1 ;;
          esac
          mkdir -p "$target"
          staging=$(mktemp -d "$target/.publish.XXXXXX")
          trap 'rm -rf "$staging"' EXIT
          for site in landing.bryanroessler.com blog.bryanroessler.com cv.bryanroessler.com; do
            cp -a "source/$site/_site" "$staging/$site"
            test -f "$staging/$site/index.html"
          done
          for site in landing.bryanroessler.com blog.bryanroessler.com cv.bryanroessler.com; do
            mkdir -p "$target/$site"
            rsync --archive --delete "$staging/$site/" "$target/$site/"
          done
