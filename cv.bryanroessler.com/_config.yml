# Site settings
title: "Bryan Roessler's CV"
# description: "A resume template for Jekyll and GitHub Pages sites."

# Build settings
markdown: kramdown
sass:
  load_paths:
    - _sass
  style: compressed

# Resume settings
resume_avatar: "true"
resume_name: "Bryan C. Roessler"
resume_title: "Lead Software Developer & Consultant"

# used for the contact button in _layouts/resume.html
resume_contact_email: "bryanroessler@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
# resume_contact_telephone: "555-7334"
resume_contact_address: "St. Petersburg, FL"

resume_header_contact_info: "St. Petersburg, FL • bryanroessler@gmail.com"
display_header_contact_info: "true"

resume_header_intro: >
  <p>I am a lead software developer, consultant, and computational biologist with 20+ years of experience and an enduring love of programming.
  I care about software that is beautiful in the practical sense: clear, legible, dependable, and simple enough to remain useful long after
  it changes hands. I began in academic computing, using Bash, R, MATLAB, and scientific software to analyze molecular-dynamics simulations
  on Linux supercomputers and job-queue systems. Today I work across Python, PHP, Ruby, SQL, and JavaScript, building full-stack applications,
  desktop tools, data workflows, and Linux infrastructure. Bash remains my favorite language because it connects programs into useful systems;
  together with Ansible and containers, I use it to create deterministic, idempotent automation that is easy to run and just works. I bring
  curiosity, careful code review, sound engineering principles, and a preference for established patterns and modern tools to every problem.</p>

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work: "yes"

# Decide which sections to use
# comment out to hide
resume_section_links: true
resume_section_education: true
resume_section_experience: true
resume_section_projects: true
resume_section_publications: true
resume_section_presentations: true
resume_section_abstracts_posters: true
resume_section_training: false
resume_section_grants: true
resume_section_skills: true
resume_section_interests: false

