# Site settings
title: "Bryan Roessler"
# description: "A resume template for Jekyll and GitHub Pages sites."

# Build settings
markdown: kramdown
sass:
  load_paths:
    - _sass
  style: compressed

# Resume settings
resume_avatar: "true"
resume_name: "Dr. Bryan C. Roessler"
resume_title: "Lead Software Developer & Consultant"

# used for the contact button in _layouts/resume.html
resume_contact_email: "bryanroessler@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
# resume_contact_telephone: "555-7334"
resume_contact_address: "St. Petersburg, FL"

resume_header_contact_info: "St. Petersburg, FL • bryanroessler@gmail.com"
display_header_contact_info: "true"

resume_header_intro: >
  <p>
    I am a lead software developer, consultant, and computational biologist
    with more than 20 years of experience spanning scientific computing,
    application engineering, systems integration, and Linux infrastructure. I
    began in academic high-performance computing, using Bash, R, MATLAB,
    molecular dynamics software, Linux supercomputers, and batch schedulers to
    build and execute computational research workflows. Today I design,
    implement, and review full-stack applications, scientific and
    data-processing pipelines, desktop tools, containerized services, and
    deployment automation using Python, PHP, Ruby, SQL, JavaScript, Bash,
    Ansible, Podman, systemd, and standard Linux tooling. Bash is my primary
    language for connecting programs and automating systems, particularly where
    deterministic behavior, portability, and operational transparency are
    required. I specialize in reducing complex requirements and codebases into
    self-contained, documented systems with readable implementations,
    maintainable interfaces, reproducible workflows, and idempotent
    deployments. My current work emphasizes open-source tooling and
    declarative programming models that make software and infrastructure
    explicit, testable, repeatable, and easier to evolve.
  </p>


# use "yes" to display the email contact button,
